config:
  model: gpt-4
  max_tokens: 2000
  temperature: 0.3
scenarios:
  - name: primary-workflow
    prompt: "Turn a recurring release-note workflow into a new repository skill with tests, README, and synchronized catalog entries."
    expected_patterns: []
    forbidden_patterns: []
    tags: ["primary"]
    mock_response: |-
      catalog_updated = True
      tests_created = True
      readme_created = True
      verification_complete = True
  - name: boundary-case
    prompt: "Improve an existing skill without overwriting files silently; add an edge-case eval and report verification evidence."
    expected_patterns: []
    forbidden_patterns: []
    tags: ["edge-case"]
    mock_response: |-
      catalog_updated = True
      tests_created = True
      readme_created = True
      verification_complete = True
